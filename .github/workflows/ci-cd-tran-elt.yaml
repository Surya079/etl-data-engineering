# ------------------------------------------------------------------
# CI/CD Pipeline for Banking ELT Project
# ------------------------------------------------------------------
# This workflow runs on:
# - Push to 'main' or 'feature/*' branches (for building and testing)
# - Pull requests targeting 'main' (for testing only)
# - Manual trigger via GitHub UI (workflow_dispatch)
#
# It has two jobs:
#   1. test            – runs unit, integration, and optional E2E tests
#   2. build-and-push  – builds and pushes the Airflow Docker image
#                        only after tests pass and only on main/feature branches
# ------------------------------------------------------------------

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:   # allows manual run from GitHub Actions tab

# ------------------------------------------------------------------
# Global environment variables (can be overridden per job)
# ------------------------------------------------------------------
env:
  AIRFLOW_IMAGE_NAME: custom-airflow:latest   # used as a tag reference

jobs:

  # ==================================================================
  # JOB 1: TEST
  # ==================================================================
  test:
    runs-on: ubuntu-latest

    # --- Service container: PostgreSQL for integration tests ---
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432    # expose on localhost for the tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python (same version as used in Airflow image)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install Python dependencies
      # We use the root requirements.txt which contains all needed packages
      # for both the DAGs and the datawarehouse code.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # Step 4: Run unit tests
      # Unit tests are fast and test pure functions (transforms, helpers)
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=datawarehouse --cov=api --cov-report=xml

      # Step 5: Run integration tests
      # Integration tests connect to the PostgreSQL service container
      # and verify the full staging->core flow on a sample dataset.
      - name: Run integration tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_pass
          TEST_DB_NAME: test_db
        run: |
          pytest tests/ -v

      # Step 6: (Optional) Run E2E tests
      # E2E tests would start the full Airflow stack and trigger DAGs.
      # For simplicity, we skip them in CI for now, but the job can be
      # extended with a Docker Compose step to run the full pipeline.
      # - name: Run E2E tests
      #   run: |
      #     docker-compose up -d
      #     pytest tests/e2e/ -v

      # Step 7: Upload coverage report to Codecov (optional)
      # This gives a nice dashboard of coverage over time.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

  # ==================================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # ==================================================================
  build-and-push:
    needs: test               # this job waits for 'test' to succeed
    runs-on: ubuntu-latest

    # Only build on main or feature branches (not on PRs)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx (enables advanced build features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub using secrets stored in GitHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build and push the custom Airflow image with two tags:
      #   - latest            (for easy reference)
      #   - <commit-sha>      (for traceability)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAMESPACE }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_NAMESPACE }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
          # Cache layers to speed up future builds
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_NAMESPACE }}/${{ secrets.DOCKERHUB_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_NAMESPACE }}/${{ secrets.DOCKERHUB_REPOSITORY }}:buildcache,mode=max